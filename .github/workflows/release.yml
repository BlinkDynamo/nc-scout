name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Install dependencies
              run: sudo apt-get update && sudo apt-get install -y gcc make valgrind

            - name: Build
              run: make

            - name: Run tests
              run: make check

            - name: Package binary
              run: |
                  version="${GITHUB_REF_NAME}"
                  mkdir -p "nc-scout_${version}"
                  cp build/nc-scout "nc-scout_${version}/"
                  cp LICENSE "nc-scout_${version}/" 2>/dev/null || true
                  cp README.md "nc-scout_${version}/" 2>/dev/null || true
                  cp -r completions "nc-scout_${version}/" 2>/dev/null || true
                  tar czf "nc-scout_${version}_linux_x86_64.tar.gz" "nc-scout_${version}"

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  name: nc-scout ${{ github.ref_name }}
                  files: nc-scout_*_linux_x86_64.tar.gz
                  generate_release_notes: true
